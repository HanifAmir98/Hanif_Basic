<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Time Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f8fa; margin: 0; padding: 0; }
        .container {
            background: #fff;
            max-width: 400px;
            margin: 60px auto;
            padding: 32px 28px 28px 28px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        h2 { text-align: center; color: #2d3a4a; margin-bottom: 24px; }
        label { display: block; margin-top: 18px; color: #444; font-weight: 500; }
        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
        }
        input[type="number"], select {
            padding: 6px 10px;
            border: 1px solid #cfd8dc;
            border-radius: 6px;
            font-size: 1rem;
            width: 70px;
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        button {
            margin-top: 28px;
            width: 100%;
            padding: 10px 0;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #125ea7; }
        .result {
            margin-top: 32px;
            background: #e3f2fd;
            border-radius: 8px;
            padding: 18px 14px;
            color: #1a237e;
            font-size: 1.15rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.07);
        }
        .result-label {
            font-weight: bold;
            color: #0d47a1;
        }
        @media (max-width: 500px) {
            .container { padding: 16px 6px; }
            input[type="number"], select { width: 55px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Work Time & OT Calculator</h2>
        <form id="workForm" onsubmit="return false;">
            <label>
                Work Hours:
                <input type="number" id="workHours" value="9.5" step="0.1" min="0" required>
            </label>
            <label>
                Start Time:
                <div class="input-row">
                    <input type="number" id="startHour" min="1" max="12" value="9" required> :
                    <input type="number" id="startMinute" min="0" max="59" value="00" required>
                    <select id="ampm">
                        <option value="AM" selected>AM</option>
                        <option value="PM">PM</option>
                    </select>
                </div>
            </label>
            <label>
                OT Hours:
                <input type="number" id="otHours" value="1" step="0.1" min="0" required>
            </label>
            <button type="button" onclick="calculateTimes()">Calculate</button>
        </form>
        <div class="result" id="result" style="display:none;"></div>
    </div>
    <div class="container" style="margin-top: 24px; text-align: center;">
        <h3 style="margin-bottom: 18px; color: #2d3a4a;">Quick Access Links</h3>
        <button onclick="window.open('https://www.renecosystem.com/ESS/MY/sasb/', '_blank')" style="background:#388e3c; margin-bottom: 14px;">Open Company ESS Portal</button><br>
        <span style="font-size:0.95em; color:#555;">(Clock-in, Payslip, OT, Leave, etc.)</span>
        <hr style="margin: 22px 0 18px 0; border: none; border-top: 1px solid #e0e0e0;">
        <button onclick="window.open('https://stratusautomation.sharepoint.com/sites/CRBChangeReviewBoard/', '_blank')" style="background:#1976d2;">Open CRB Submission Portal</button><br>
        <span style="font-size:0.95em; color:#555;">(Submit Change Review Board requests)</span>
    </div>
    <button onclick="window.open('https://www.youtube.com', '_blank')" 
        style="position:fixed; right:24px; bottom:92px; background:#ff0000; color:#fff; border:none; border-radius:50%; width:56px; height:56px; font-size:2rem; box-shadow:0 2px 8px rgba(0,0,0,0.15); cursor:pointer; z-index:1000; display:flex; align-items:center; justify-content:center; padding:0;"
        title="Open YouTube">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;">
            <circle cx="16" cy="16" r="16" fill="#ff0000"/>
            <polygon points="13,11 24,16 13,21" fill="#fff"/>
        </svg>
    </button>
    <button onclick="window.open('https://www.google.com', '_blank')" 
        style="position:fixed; right:24px; bottom:24px; background:#8ecaff; color:#fff; border:none; border-radius:50%; width:56px; height:56px; font-size:2rem; box-shadow:0 2px 8px rgba(0,0,0,0.15); cursor:pointer; z-index:1000; display:flex; align-items:center; justify-content:center; padding:0;"
        title="Open Google">
        <svg width="40" height="40" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="display:block;">
            <g>
                <circle cx="16" cy="16" r="16" fill="#8ecaff"/>
                <path d="M23.6 16.2c0-.5-.1-.9-.2-1.3H16v2.6h4.3c-.2 1.1-1.3 3.1-4.3 3.1-2.6 0-4.7-2.2-4.7-4.8s2.1-4.8 4.7-4.8c1.5 0 2.5.6 3.1 1.2l2.1-2c-1.4-1.3-3.1-2.1-5.2-2.1-4 0-7.2 3.2-7.2 7.2s3.2 7.2 7.2 7.2c4.1 0 6.8-2.9 6.8-7 0-.5-.1-.9-.2-1.3z" fill="#fff"/>
                <path d="M16 24c2.2 0 4.1-.7 5.5-2l-2.6-2c-.7.5-1.7.8-2.9.8-2.2 0-4-1.5-4.7-3.5H8.6v2.2C10 22.2 12.8 24 16 24z" fill="#34a853"/>
                <path d="M11.3 17.3c-.2-.5-.3-1-.3-1.6s.1-1.1.3-1.6v-2.2H8.6C8.2 13.8 8 14.9 8 16s.2 2.2.6 3.2l2.7-2z" fill="#fbbc05"/>
                <path d="M16 11.5c1.2 0 2.3.4 3.1 1.2l2.1-2C19.9 9.2 18.1 8.5 16 8.5c-3.2 0-6 1.8-7.4 4.5l2.7 2c.7-2 2.5-3.5 4.7-3.5z" fill="#ea4335"/>
            </g>
        </svg>
    </button>
    <script>
        function formatTime(hour24, minute) {
            let ampm = hour24 >= 12 ? 'PM' : 'AM';
            let hour12 = hour24 % 12;
            if (hour12 === 0) hour12 = 12;
            return `${hour12.toString().padStart(2, '0')}:${minute.toString().padStart(2, '0')} ${ampm}`;
        }

        function calculateTimes() {
            const workHours = parseFloat(document.getElementById('workHours').value);
            let hour = parseInt(document.getElementById('startHour').value, 10);
            let minute = parseInt(document.getElementById('startMinute').value, 10);
            const ampm = document.getElementById('ampm').value;
            const otHours = parseFloat(document.getElementById('otHours').value);

            if (ampm === 'PM' && hour !== 12) hour += 12;
            if (ampm === 'AM' && hour === 12) hour = 0;

            // Calculate end work time
            let totalMinutes = hour * 60 + minute + Math.round(workHours * 60);
            let endHour = Math.floor(totalMinutes / 60) % 24;
            let endMinute = totalMinutes % 60;

            // Calculate end OT time
            let otMinutes = totalMinutes + Math.round(otHours * 60);
            let otHour = Math.floor(otMinutes / 60) % 24;
            let otMinute = otMinutes % 60;

            // Output
            document.getElementById('result').style.display = 'block';
            document.getElementById('result').innerHTML =
                `<div><span class='result-label'>End Work Time:</span> ${formatTime(endHour, endMinute)}</div>` +
                `<div style='margin-top:12px;'><span class='result-label'>End OT Time:</span> ${formatTime(otHour, otMinute)}</div>`;
        }
    </script>
</body>
</html>
